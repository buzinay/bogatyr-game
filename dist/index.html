<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5eddd">
  <meta name="description" content="Собери богатыря в поход, выбери оружие на поляне и познакомься с обитателями леса.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://buzinay.github.io/bogatyr-game/">
  <meta property="og:title" content="Собери богатыря в поход">
  <meta property="og:description" content="Собери 27 находок, сопоставь фигурные детали и раскрой тайну камина Врубеля.">
  <meta property="og:image" content="https://buzinay.github.io/bogatyr-game/assets/intro/link-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Богатырь стоит рядом с камином Врубеля">
  <meta name="twitter:card" content="summary_large_image">
  <title>Богатырский поход</title>
  <style>
    #bogatyr-game > .game-loading {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 24px;
      text-align: center;
      color: #34291f;
      background: radial-gradient(ellipse at center, #fff8e5, #f5eddd 65%);
    }
    #bogatyr-game > .game-loading img {
      width: clamp(100px, 22vw, 160px);
      height: auto;
      transform-origin: center;
      animation: game-loading-sun 2s linear infinite;
    }
    #bogatyr-game > .game-loading p { margin: 6px 0 0; font: 15px/1.5 system-ui, sans-serif; }
    #bogatyr-game > .game-loading .game-loading-title { margin-top: 16px; font: 600 clamp(24px, 5vw, 36px)/1.2 Georgia, serif; }
    @keyframes game-loading-sun { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #bogatyr-game > .game-loading img { animation: none; } }
  </style>
  <noscript><style>#bogatyr-game > .game-loading { display: none; }</style></noscript>
  <link rel="preload" as="image" href="./assets/intro/loading-sun.png" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/intro/fireplace.webp">
  <link rel="preload" as="image" href="./assets/intro/hero.webp">
</head>
<body style="margin:0;background:#f5eddd">
  <main id="bogatyr-game">
    <div class="game-loading" role="status">
      <img src="./assets/intro/loading-sun.png" width="200" height="200" alt="">
      <p class="game-loading-title">Богатырский поход</p>
      <p>Загружаем игру…</p>
    </div>
  </main>
  <noscript>Для игры включите JavaScript в настройках браузера.</noscript>
  <script type="module" src="./app.js?v=finale-1"></script>
</body>
</html>
